[project]
name = "xiaoyuzhoufm-text"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6,<1",
    "httpx>=0.28.1,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.vercel]
entrypoint = "app.serverless:app"
